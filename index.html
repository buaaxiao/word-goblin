<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#4a7cff" id="themeColorMeta" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <title>单词精灵</title>
    <link rel="icon" href="data:," />

    <!-- CSS：按依赖顺序引入 -->
    <link rel="stylesheet" href="css/variables.css" />
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/table-base.css" />
    <link rel="stylesheet" href="css/table-chapter.css" />
    <link rel="stylesheet" href="css/table-word.css" />
    <link rel="stylesheet" href="css/chapter-search.css" />
    <link rel="stylesheet" href="css/chapter-hint.css" />
    <link rel="stylesheet" href="css/modals.css" />
    <link rel="stylesheet" href="css/custom-select.css" />
    <link rel="stylesheet" href="css/responsive.css" />
  </head>

  <body>
    <header class="appbar">
      <div class="appbar-top">
        <h1>单词精灵</h1>
        <div class="appbar-actions">
          <button
            class="appbar-btn"
            onclick="openStats()"
            title="查看统计与历史"
          >
            📊
          </button>
          <button class="appbar-btn" onclick="openSettings()" title="打开设置">
            ⚙️
          </button>
          <button class="appbar-btn" onclick="openHelp()" title="使用帮助">
            ❓
          </button>
          <span class="theme-tag" id="themeTag" title="当前主题颜色模式">
            <span class="theme-icon" id="themeIcon">🌙</span>
            <span class="theme-text" id="themeText">深色</span>
          </span>
        </div>
      </div>
    </header>

    <main>
      <section id="libSection">
        <div class="stats-card">
          <div class="stat-item" onclick="jumpToWrongWords()">
            <div class="stat-num" id="statChapters">0</div>
            <div class="stat-label">章节</div>
          </div>
          <div class="stat-item">
            <div class="stat-num" id="statWords">0</div>
            <div class="stat-label">单词</div>
          </div>
          <div class="stat-item" onclick="jumpToWrongWords()">
            <div class="stat-num danger" id="statWrong">0</div>
            <div class="stat-label">错词</div>
          </div>
          <div class="stat-item">
            <div class="stat-num ok" id="statSelected">0</div>
            <div class="stat-label">已选章节</div>
          </div>
        </div>

        <div class="card quick-actions" style="padding: 12px 16px">
          <div
            class="row"
            style="margin: 0; flex-wrap: wrap; align-items: center"
          >
            <button
              class="primary"
              onclick="startDictQuick()"
              title="开始默写所选章节的单词"
            >
              <span class="btn-ico">🚀</span><span>开始默写</span>
            </button>

            <div class="data-ops" tabindex="0" title="数据操作">
              <span class="data-ops-trigger">
                <span class="btn-ico">🗂️</span
                ><span class="data-ops-label">数据操作</span>
                <span class="data-ops-caret">▾</span>
              </span>

              <div class="data-ops-panel" role="menu">
                <button
                  class="data-ops-item"
                  onclick="openAddModal()"
                  title="新增章节或单词"
                >
                  <span class="btn-ico">➕</span><span>新增</span>
                </button>
                <button
                  class="data-ops-item"
                  onclick="importData()"
                  title="从文件导入数据"
                >
                  <span class="btn-ico">📥</span><span>导入</span>
                </button>
                <button
                  class="data-ops-item"
                  onclick="confirmExport()"
                  title="导出数据到文件"
                >
                  <span class="btn-ico">📤</span><span>导出</span>
                </button>
                <button
                  class="data-ops-item"
                  onclick="syncFromCloud()"
                  title="数据同步：将共享词库合并到本地，本地数据可能丢失，请先导出备份"
                >
                  <span class="btn-ico">☁️</span><span>同步</span>
                </button>
              </div>
            </div>
          </div>
        </div>

        <div class="card">
          <!-- ★ 章节搜索框：放在标题栏上方，只此一处 -->
          <div class="combo-wrap search-wrap" id="chapterCombo">
            <span class="search-icon">🔍</span>
            <input
              type="text"
              id="chapterSearch"
              autocomplete="off"
              spellcheck="false"
              oninput="onChapterSearch()"
              onfocus="openChapterCombo()"
              onkeydown="onChapterSearchKeydown(event)"
            />
            <!-- 打字机提示层（覆盖在 input 上） -->
            <span class="chapter-search-hint" id="chapterSearchHint"></span>
            <button
              class="search-clear"
              onclick="clearChapterSearch(event)"
              title="清空"
            >
              ✕
            </button>
            <div
              class="combo-panel hidden"
              id="chapterComboPanel"
              role="listbox"
            ></div>
          </div>

          <div
            class="collapse-header"
            id="chapterHeader"
            onclick="toggleSection('chapter')"
          >
            <span class="collapse-chevron">▼</span>
            <span class="collapse-arrow" id="chapterArrow">📂</span>
            <h2>课文章节</h2>
            <span class="collapse-badge" id="chapterCountBadge">0 章节</span>
            <button
              id="modeBtnChapter"
              class="list-mode-btn"
              title="切换编辑/查看模式"
              onclick="
                event.stopPropagation();
                toggleChapterMode();
              "
            >
              👁 查看
            </button>
          </div>

          <div class="collapse-body collapsed" id="chapterBody">
            <div class="chapter-table-header">
              <span class="th-handle-spacer">≡</span>
              <input
                type="checkbox"
                id="selectAllChapters"
                onchange="toggleSelectAllChapters(this.checked)"
                title="全选 / 取消全选"
              />
              <span
                class="th-name sortable"
                onclick="toggleChapterSort('name')"
                title="点击按名称排序"
                >章节名称 <span class="sort-icon"></span
              ></span>
              <span
                class="th-count sortable"
                onclick="toggleChapterSort('count')"
                title="点击按单词数排序"
                >单词数 <span class="sort-icon"></span
              ></span>
              <span class="th-action-edit" title="编辑">编辑</span>
              <span class="th-action-del" title="删除">删除</span>
            </div>
            <div id="chapterList"></div>
            <p class="hint-text" id="dataSourceHint"></p>
          </div>
        </div>

        <div class="card">
          <div
            class="collapse-header"
            id="wordHeader"
            onclick="toggleSection('word')"
          >
            <span class="collapse-chevron">▼</span>
            <span class="collapse-arrow" id="wordArrow">📁</span>
            <h2 id="wordChapterTitle">选中章节单词合集</h2>
            <span class="collapse-badge" id="wordCountBadge">0 词</span>
            <button
              id="dedupeBtn"
              class="list-mode-btn dedupe-btn"
              title="开启去重：相同单词只显示第一个"
              onclick="
                event.stopPropagation();
                toggleDedupe();
              "
            >
              🧹 去重
            </button>
            <button
              id="modeBtnWord"
              class="list-mode-btn"
              title="切换编辑/查看模式"
              onclick="
                event.stopPropagation();
                toggleWordMode();
              "
            >
              👁 查看
            </button>
          </div>
          <div class="collapse-body collapsed" id="wordBody">
            <div class="search-wrap" id="wordSearchWrap">
              <span class="search-icon">🔍</span>
              <input
                type="text"
                id="wordSearch"
                placeholder="搜索单词或释义…"
                oninput="onWordSearch()"
              />
              <button
                class="search-clear"
                onclick="clearWordSearch(event)"
                title="清空"
              >
                ✕
              </button>
            </div>

            <div class="word-table-header">
              <span class="th-handle-spacer"></span>
              <span
                class="th-name sortable"
                onclick="toggleWordSort('text')"
                title="点击按单词排序"
                >单词<span class="sort-icon"></span
              ></span>
              <span
                class="th-num sortable"
                onclick="toggleWordSort('correctCount')"
                title="点击按答对次数排序"
                >对<span class="sort-icon"></span
              ></span>
              <span
                class="th-date sortable"
                onclick="toggleWordSort('lastCorrectDate')"
                title="点击按最后答对日期排序"
                >最后对<span class="sort-icon"></span
              ></span>
              <span
                class="th-num sortable"
                onclick="toggleWordSort('wrongCount')"
                title="点击按答错次数排序"
                >错<span class="sort-icon"></span
              ></span>
              <span
                class="th-date sortable"
                onclick="toggleWordSort('lastErrorDate')"
                title="点击按最后答错日期排序"
                >最后错<span class="sort-icon"></span
              ></span>
              <span
                class="th-score sortable"
                onclick="toggleWordSort('score')"
                title="点击按均分排序"
                >均分 <span class="sort-icon"></span
              ></span>
              <span class="th-action-edit" title="编辑">编辑</span>
              <span class="th-action-del" title="删除">删除</span>
            </div>
            <div id="wordList"></div>
          </div>
        </div>
      </section>
    </main>

    <!-- 通用弹窗容器 -->
    <div id="modal" class="modal hidden">
      <div class="modal-box" id="modalBody"></div>
    </div>
    <input
      type="file"
      id="fileInput"
      accept=".json,application/json"
      style="display: none"
    />

    <!-- 三个弹窗外壳：内容由 main.js 启动时注入 -->
    <div id="settingsModal" class="modal hidden"></div>
    <div id="statsModal" class="modal hidden"></div>
    <div id="dictModal" class="modal hidden"></div>
    <div id="helpModal" class="modal hidden"></div>

    <!-- partials：提供 window.__PARTIAL_* 字符串 -->
    <script src="partials/settings-modal.js"></script>
    <script src="partials/stats-modal.js"></script>
    <script src="partials/dictation-modal.js"></script>
    <script src="partials/help-modal.js"></script>

    <!-- js 逻辑：按依赖顺序 -->
    <script src="js/constants.js"></script>
    <script src="js/config.js"></script>
    <script src="js/core.js"></script>
    ...
    <script src="js/custom-select.js"></script>
    <script src="js/db.js"></script>
    <script src="js/settings-store.js"></script>
    <script src="js/storage.js"></script>
    <script src="js/reports.js"></script>
    <script src="js/words.js"></script>
    <script src="js/chapters.js"></script>
    <script src="js/chapters-modals.js"></script>
    <script src="js/chapters-search.js"></script>
    <script src="js/io.js"></script>
    <script src="js/dictation.js"></script>
    <script src="js/main.js"></script>
    <script src="js/modal-actions.js"></script>
  </body>
</html>
